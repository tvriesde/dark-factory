name: Deploy use cases to Pages
run-name: ${{ inputs.pull_request && format('Publish Pages for PR #{0}', inputs.pull_request) || 'Publish Pages from main' }}

on:
  workflow_dispatch:
    inputs:
      pull_request:
        description: Merged pull request number (optional for manual deployments)
        type: string
        required: false

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Build the use-case catalog
        run: python3 scripts/build_pages.py "$RUNNER_TEMP/pages-site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
