name: Deploy use cases to Pages
run-name: ${{ github.event.pull_request.number && format('Publish Pages for PR #{0}', github.event.pull_request.number) || 'Publish Pages from main' }}

on:
  pull_request_target:
    types: [closed]
    branches: [main]
  workflow_dispatch:

permissions: {}

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    if: >-
      github.ref == 'refs/heads/main' &&
      (github.event_name == 'workflow_dispatch' || github.event.pull_request.merged == true)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          # Use the base branch commit, never the PR head.
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Build the use-case catalog
        run: python3 scripts/build_pages.py "$RUNNER_TEMP/pages-site"
      - uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/pages-site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publish to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
