<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f1fa">
  <title>Balloon Pop Panic</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="./styles.css">
  <script defer src="./storage.js"></script>
  <script defer src="./audio.js"></script>
  <script defer src="./game.js"></script>
</head>
<body>
  <main id="app">
    <div id="frame">
      <div id="game" role="application" tabindex="-1" aria-hidden="true"
           aria-label="Balloon Pop Panic game. Press and hold, or hold Space, to shrink."
           aria-describedby="scoreDesc">
        <canvas id="view" aria-hidden="true"></canvas>
        <div class="hud" aria-hidden="true">
          <span class="pill score-pill" id="hudScore">0 m</span>
          <span class="pill energy-pill" id="energyPill">
            <span class="glyph-balloon"></span>
            <span class="bar"><span class="bar-fill" id="energyFill"></span></span>
            <span class="glyph-warn">!</span>
          </span>
        </div>
      </div>

      <section id="startOverlay" class="overlay" aria-labelledby="startTitle">
        <div class="card">
          <h1 id="startTitle">Balloon Pop Panic</h1>
          <p class="hint">Hold to shrink, collect coins for energy</p>
          <button type="button" id="startBtn" class="btn primary">Start</button>
          <button type="button" class="btn secondary sound-toggle"><span aria-hidden="true">♪</span> <span class="sound-label">Sound: On</span></button>
          <p class="best" id="startBest">Best —</p>
          <p class="kbd-hint">Hold Space to shrink · P pause · M mute</p>
        </div>
      </section>

      <section id="pauseOverlay" class="overlay" aria-labelledby="pauseTitle" hidden>
        <div class="card">
          <h2 id="pauseTitle">Paused</h2>
          <p class="big-score" id="pauseScore">0 m</p>
          <button type="button" id="resumeBtn" class="btn primary">Resume</button>
          <button type="button" id="pauseRestartBtn" class="btn secondary">Restart</button>
          <button type="button" class="btn secondary sound-toggle"><span aria-hidden="true">♪</span> <span class="sound-label">Sound: On</span></button>
          <p class="kbd-hint">P or Esc to resume</p>
        </div>
      </section>

      <section id="overOverlay" class="overlay" aria-labelledby="overTitle" hidden>
        <div class="card">
          <h2 id="overTitle">Pop!</h2>
          <p class="big-score" id="overScore">0 m</p>
          <p class="badge" id="newBest" hidden><span aria-hidden="true">★</span> New best!</p>
          <p class="best" id="overBest">Best —</p>
          <button type="button" id="restartBtn" class="btn primary">Restart</button>
          <button type="button" class="btn secondary sound-toggle"><span aria-hidden="true">♪</span> <span class="sound-label">Sound: On</span></button>
        </div>
      </section>
    </div>
    <p id="scoreDesc" class="sr-only">Score in metres climbed</p>
    <div id="live" class="sr-only" role="status" aria-live="polite"></div>
  </main>
</body>
</html>
